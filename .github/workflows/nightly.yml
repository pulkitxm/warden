name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: make ci
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly CI failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The scheduled full CI run failed: ${runUrl}`
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'nightly' })
            const existing = issues.find((i) => i.title === title)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['nightly'] })
            }
