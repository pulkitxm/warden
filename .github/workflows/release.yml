name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -e 'import { ANALYZER_VERSION } from "./src/schema.ts"; process.stdout.write(ANALYZER_VERSION)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to cut"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new; cutting a release"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p release
          bun build src/bin/warden.ts --compile --target=bun-${{ matrix.os }}-${{ matrix.arch }} --outfile release/warden
          bun build src/bin/wnpm.ts --compile --target=bun-${{ matrix.os }}-${{ matrix.arch }} --outfile release/wnpm
          bun build src/bin/wnpx.ts --compile --target=bun-${{ matrix.os }}-${{ matrix.arch }} --outfile release/wnpx
          tar -C release -czf warden-${{ matrix.os }}-${{ matrix.arch }}.tar.gz warden wnpm wnpx
      - uses: actions/upload-artifact@v4
        with:
          name: warden-${{ matrix.os }}-${{ matrix.arch }}
          path: warden-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Stage the executable support files alongside the binaries
        run: |
          cp web/public/install.sh release/install.sh
          cp scripts/shim.sh release/shim.sh
      - run: cd release && sha256sum *.tar.gz install.sh shim.sh > sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.tar.gz
            release/install.sh
            release/shim.sh
            release/sha256sums.txt
